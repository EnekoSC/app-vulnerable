# portal vulnerable santa s.l. - laboratorio aislado, no exponer a internet
# los puertos salen solo por 127.0.0.1 (ver README para el modo host-only con kali)
name: santasl-vuln

services:
  # php-fpm con el codigo laravel
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: santasl_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-santasl}
      DB_USERNAME: ${DB_USERNAME:-santasl}
      DB_PASSWORD: ${DB_PASSWORD:-santasl}
    volumes:
      - ../app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - santasl

  # nginx sirviendo public/
  nginx:
    image: nginx:1.27-alpine
    container_name: santasl_nginx
    restart: unless-stopped
    # solo loopback. cambia a la ip host-only si lo quieres alcanzar desde kali
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - santasl

  # mysql 8
  db:
    image: mysql:8.0
    container_name: santasl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-santasl}
      MYSQL_USER: ${DB_USERNAME:-santasl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-santasl}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    # publicado en loopback por si quieres mirar la bd desde el host
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - santasl

networks:
  santasl:
    driver: bridge

volumes:
  dbdata:
